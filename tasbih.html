<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasbih — Salah</title>
  <meta name="description" content="A tasbih counter for dhikr after prayer and throughout the day.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1020" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Salah">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      const theme = localStorage.getItem("theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body data-page="tasbih">
  <header class="topbar">
    <a class="brand" href="./">Salah</a>
    <nav class="nav" aria-label="Main">
      <a href="./" data-page="home">Prayer times</a>
      <a href="quran.html" data-page="quran">Quran</a>
      <a href="tasbih.html" data-page="tasbih">Tasbih</a>
      <a href="calendar.html" data-page="calendar">Calendar</a>
    </nav>
    <button id="install-btn" class="chip install-btn" type="button" hidden>Install app</button>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
    </button>
  </header>

  <main class="tasbih-page">
    <div class="segmented" role="tablist" aria-label="Mode">
      <button id="mode-prayer" role="tab" type="button">After prayer</button>
      <button id="mode-free" role="tab" type="button">Free count</button>
    </div>

    <div id="free-controls" class="free-controls" hidden>
      <label>Dhikr <select id="phrase"></select></label>
      <label>Target
        <select id="target">
          <option value="33">33</option>
          <option value="99">99</option>
          <option value="100">100</option>
          <option value="0">No limit</option>
        </select>
      </label>
    </div>

    <section class="dhikr">
      <p id="dhikr-ar" class="dhikr-ar" lang="ar" dir="rtl"></p>
      <p id="dhikr-tr" class="dhikr-tr"></p>
      <p id="dhikr-en" class="muted"></p>
      <p id="dhikr-ur" class="muted urdu" lang="ur" dir="rtl"></p>
    </section>

    <button id="counter" class="counter" type="button" aria-label="Count">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="counter-track" cx="100" cy="100" r="90" />
        <circle id="counter-ring" class="counter-ring" cx="100" cy="100" r="90" />
      </svg>
      <span class="counter-inner">
        <span id="count" class="count">0</span>
        <span id="count-of" class="count-of muted"></span>
      </span>
    </button>
    <p class="muted small center">Tap the circle or press Space</p>

    <ol id="steps" class="steps"></ol>
    <p id="complete" class="complete" hidden>Completed. May Allah accept it.</p>

    <div class="tasbih-actions">
      <button id="undo" class="outline-btn" type="button">Undo</button>
      <button id="reset" class="outline-btn" type="button">Reset</button>
    </div>

    <dl class="stats card">
      <div><dt class="muted">Today</dt><dd id="stat-today">0</dd></div>
      <div><dt class="muted">All time</dt><dd id="stat-total">0</dd></div>
    </dl>
  </main>

  <footer>
    <span>After each prayer: SubhanAllah 33, Alhamdulillah 33, Allahu Akbar 34 (Sahih Muslim)</span>
  </footer>

  <script src="common.js"></script>
  <script src="tasbih.js"></script>
</body>
</html>
